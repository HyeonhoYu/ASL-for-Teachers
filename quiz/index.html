<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz | ASL for Teachers</title>
<meta name="description" content="American Sign Language and Deaf culture for preservice teachers.">
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="container">
  <section class="section stack" style="gap:24px" id="quiz"></section>
</div>
</main>
<footer id="site-footer"></footer>
<script>const ROOT = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
renderChrome("practice");

const root = document.getElementById("quiz");
let qs = [], n = 0, score = 0;
function startQuiz() {
  const pool = SIGNS.filter(s => !s.recipe.compound);
  qs = shuffle(pool).slice(0, 10).map(s => ({ s, opts: shuffle([s, ...shuffle(pool.filter(x => x.id !== s.id)).slice(0, 3)]) }));
  n = 0; score = 0; show();
}
function show() {
  if (n >= qs.length) return finish();
  const { s, opts } = qs[n];
  root.innerHTML = `
    <div class="row between"><h1 style="font-size:clamp(32px,4vw,44px)">Quiz</h1><span class="pill pill-gold">Question ${n + 1} of ${qs.length}</span></div>
    <p style="font-weight:700;font-size:20px">Read this sign card. Which sign is it?</p>
    ${recipeHTML(s)}
    <div class="quiz-options">${opts.map(o => `<button data-id="${o.id}">${esc(o.gloss)}</button>`).join("")}</div>
    <p id="feedback" aria-live="polite" class="muted"></p>`;
  initFallbacks(root);
  root.querySelectorAll(".quiz-options button").forEach(b => b.addEventListener("click", () => answer(b, s)));
}
function answer(btn, s) {
  const right = btn.dataset.id === s.id;
  if (right) score++;
  root.querySelectorAll(".quiz-options button").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === s.id) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
  });
  document.getElementById("feedback").innerHTML = `${right ? "Correct." : `Not quite. This sign is ${esc(s.gloss)}.`} <button class="btn btn-small btn-primary" id="nextQ" style="margin-left:8px">${n + 1 < qs.length ? "Next question" : "See results"}</button>`;
  document.getElementById("nextQ").addEventListener("click", () => { n++; show(); });
  document.getElementById("nextQ").focus();
}
function finish() {
  const st = loadStore();
  if (score > st.quizBest) { st.quizBest = score; saveStore(st); }
  root.innerHTML = `
    <div class="row" style="gap:24px"><img src="${u("images/clap.webp")}" alt="" style="width:180px">
      <div class="stack" style="flex:1 1 300px">
        <h1 style="font-size:clamp(32px,4vw,48px)">You got ${score} of ${qs.length}</h1>
        <p class="muted">Your best score: ${Math.max(score, st.quizBest)} of 10</p>
        <div class="row"><button class="btn btn-primary" id="again">Try another quiz</button><a class="btn btn-outline" href="${u("dictionary/")}">Review signs</a></div>
      </div></div>`;
  document.getElementById("again").addEventListener("click", startQuiz);
}
startQuiz();

initFallbacks();
</script>
</body>
</html>
