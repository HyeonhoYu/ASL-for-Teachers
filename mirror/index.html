<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Practice | ASL for Teachers</title>
<meta name="description" content="American Sign Language and Deaf culture for preservice teachers.">
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="container">
  <section class="section stack" style="gap:24px">
    <div class="stack" style="gap:8px">
      <h1 style="font-size:clamp(36px,5vw,56px)">Mirror Practice</h1>
      <p class="muted" style="font-size:20px">Read the sign card, then sign along and watch yourself. Your camera stays on this device. Nothing is recorded or saved.</p>
    </div>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="flex:0 1 360px"><label for="pick">Sign to practice</label><select id="pick"></select></div>
      <button class="btn btn-primary" id="camBtn">Turn on camera</button>
    </div>
    <div class="cam-wrap" id="camWrap" style="max-width:720px"><video id="cam" autoplay playsinline muted hidden></video><p id="camMsg" style="position:relative">Your camera view will appear here.</p></div>
    <div id="card"></div>
  </section>
</div>
</main>
<footer id="site-footer"></footer>
<script>const ROOT = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
renderChrome("practice");

const pick = document.getElementById("pick");
SIGNS.slice().sort((a, b) => a.gloss.localeCompare(b.gloss)).forEach(s => pick.insertAdjacentHTML("beforeend", `<option value="${s.id}">${esc(s.gloss)}</option>`));
pick.value = signById(param("id")) ? param("id") : "wait";
function load() { const box = document.getElementById("card"); box.innerHTML = recipeHTML(signById(pick.value)); initFallbacks(box); }
pick.addEventListener("change", load);
load();
let stream = null;
const camBtn = document.getElementById("camBtn");
camBtn.addEventListener("click", async () => {
  const cam = document.getElementById("cam"), msg = document.getElementById("camMsg");
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; cam.hidden = true; msg.hidden = false; camBtn.textContent = "Turn on camera"; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    cam.srcObject = stream; cam.hidden = false; msg.hidden = true; camBtn.textContent = "Turn off camera";
  } catch (e) {
    msg.textContent = "The camera could not start. Check that your browser has permission to use the camera, then try again.";
  }
});

initFallbacks();
</script>
</body>
</html>
