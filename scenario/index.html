<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario | ASL for Teachers</title>
<meta name="description" content="American Sign Language and Deaf culture for preservice teachers.">
<link rel="icon" href="../images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="container" id="scen"></div>
</main>
<footer id="site-footer"></footer>
<script>const ROOT = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
renderChrome("practice");

const sc = SCENARIOS.find(x => x.id === param("s")) || SCENARIOS[0];
document.title = `${sc.title} | ASL for Teachers`;
const signs = sc.signs.map(signById).filter(Boolean);
document.getElementById("scen").innerHTML = `
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="${u("practice/")}">Practice</a><span aria-hidden="true">/</span><a href="${u("practice/#scenarios")}">Scenarios</a><span aria-hidden="true">/</span><span style="color:#3B2620;font-weight:700">${esc(sc.title)}</span></nav>
  <section class="section stack" style="gap:24px">
    <div class="stack" style="gap:8px">
      <h1 style="font-size:clamp(36px,5vw,56px)">${esc(sc.title)}</h1>
      <p class="muted" style="font-size:20px">${esc(sc.context)}</p>
    </div>
    <div class="clue">Read each sign card in order, then try the whole sequence yourself, the way you would in your own classroom.</div>
    <ol class="uses">
      ${signs.map((s, n) => `<li class="row" style="gap:16px"><span class="module-card"><span class="num" style="width:40px;height:40px;font-size:18px">${n + 1}</span></span><div style="width:110px" class="thumb">${s.recipe.compound ? `<span class="thumb-compound">${s.recipe.compound.join(" + ")}</span>` : bodyMapSVG(s.recipe.location, true)}</div><div class="stack" style="flex:1 1 200px;gap:2px"><a href="${signLink(s.id)}" style="font-family:var(--display);font-weight:700;font-size:22px">${esc(s.gloss)}</a><span class="muted small">${esc(s.meaning)}</span></div></li>`).join("")}
    </ol>
  </section>`;

initFallbacks();
</script>
</body>
</html>
