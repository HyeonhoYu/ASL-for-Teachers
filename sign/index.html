<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign | ASL for Teachers</title>
<meta name="description" content="American Sign Language and Deaf culture for preservice teachers.">
<link rel="icon" href="../images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="container" id="sign"></div>
</main>
<footer id="site-footer"></footer>
<script>const ROOT = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
renderChrome("learn");

const s = signById(param("id")) || SIGNS[0];
document.title = `${s.gloss} | ASL for Teachers`;
const list = SIGNS.filter(x => x.category === s.category);
const i = list.indexOf(s);
const prev = list[i - 1], next = list[i + 1];
const f = s.form;
const formHTML = f ? `
  <dl class="form-list">
    <div><dt>Handshape</dt><dd>${esc(f.handshape)}</dd></div>
    <div><dt>Location</dt><dd>${esc(f.location)}</dd></div>
    <div><dt>Movement</dt><dd>${esc(f.movement)}</dd></div>
    <div><dt>Facial expression</dt><dd>${esc(f.face)}</dd></div>
  </dl>` : `<p style="padding:0 24px 18px">${esc(s.summary)}</p>`;
const learned = isLearned(s.id);
document.getElementById("sign").innerHTML = `
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="${u("learn/")}">Learn</a><span aria-hidden="true">/</span>
    <a href="${u("module/?m=2")}">Module 2: Classroom Signs</a><span aria-hidden="true">/</span>
    <a href="${u(`module/?m=2#${s.category}`)}">${esc(lessonTitle(s.category))}</a><span aria-hidden="true">/</span>
    <span style="color:#3B2620;font-weight:700">${esc(s.gloss)}</span>
  </nav>
  <section class="stack" style="gap:8px;padding-top:24px">
    <span class="pill pill-leaf" style="align-self:flex-start">${esc(lessonTitle(s.category))}</span>
    <div class="gloss-title" style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap"><h1 style="font-size:clamp(48px,7vw,76px)">${esc(s.gloss)}</h1><p style="font-size:21px;color:#5A4640;padding-bottom:10px">English meaning: ${esc(s.meaning)}.</p></div>
  </section>
  <section aria-label="Sign card" style="padding-top:20px" class="stack">
    ${recipeHTML(s)}
    <div class="row" style="gap:12px">
      <button class="btn toggle learned" id="learnedBtn" aria-pressed="${learned}">${learned ? "Learned" : "Mark as learned"}</button>
      <a class="btn btn-outline" href="${u(`mirror/?id=${s.id}`)}">Practice in the mirror</a>
      <a class="btn btn-small btn-outline ref-btn" href="${referenceURL(s)}" target="_blank" rel="noopener">See a reference video</a>
      <span class="ref-note">Opens an outside dictionary in a new tab.</span>
    </div>
  </section>
  <div class="detail">
    <section class="info" aria-label="Description" style="flex:1 1 420px">
      <div class="box">
        <h2>In words</h2>
        ${formHTML}
        ${s.reviewed ? "" : '<p class="draft-note">[Draft description, to be reviewed by ASL consultant]</p>'}
      </div>
    </section>
    <section class="info" aria-label="In the classroom" style="flex:1 1 420px">
      <div class="stack" style="gap:12px">
        <h2 style="font-size:20px;font-family:var(--body)">In the classroom</h2>
        <ul class="uses">${(s.classroom || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      </div>
      ${s.tip ? `<div class="tip"><img src="${u("images/wink.webp")}" alt=""><p><strong>Frog Baby's tip.</strong> ${esc(s.tip)}</p></div>` : ""}
    </section>
  </div>
  ${(s.related || []).length ? `
  <section class="stack" style="padding-bottom:40px">
    <h2 style="font-size:30px">Related signs</h2>
    <div class="grid-sm">${s.related.map(signById).filter(Boolean).map(signCardHTML).join("")}</div>
  </section>` : ""}
  <nav class="pager" aria-label="Lesson navigation">
    ${prev ? `<a href="${signLink(prev.id)}"><span>Previous sign</span>${esc(prev.gloss)}</a>` : ""}
    ${next ? `<a class="next" href="${signLink(next.id)}"><span>Next sign</span>${esc(next.gloss)}</a>` : `<a class="next" href="${u(`module/?m=2#${s.category}`)}"><span>Back to</span>${esc(lessonTitle(s.category))}</a>`}
  </nav>`;
const lb = document.getElementById("learnedBtn");
lb.addEventListener("click", () => {
  const on = lb.getAttribute("aria-pressed") !== "true";
  setLearned(s.id, on);
  lb.setAttribute("aria-pressed", String(on));
  lb.textContent = on ? "Learned" : "Mark as learned";
});

initFallbacks();
</script>
</body>
</html>
