<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Progress | ASL for Teachers</title>
<meta name="description" content="American Sign Language and Deaf culture for preservice teachers.">
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="container">
  <section class="section stack" style="gap:28px">
    <div class="row" style="gap:24px">
      <img src="../images/hug.webp" alt="" style="width:130px">
      <div class="stack" style="flex:1 1 400px;gap:8px">
        <h1 style="font-size:clamp(36px,5vw,56px)">My Progress</h1>
        <p class="muted" style="font-size:20px">Saved in this browser only. Clearing your browser data clears your progress.</p>
      </div>
    </div>
    <div class="grid" id="modules"></div>
    <div class="row" id="stats"></div>
    <section class="stack"><h2 style="font-size:30px">Signs you have learned</h2><div class="grid-sm" id="learned"></div></section>
    <div><button class="btn btn-outline" id="reset">Reset my progress</button></div>
  </section>
</div>
</main>
<footer id="site-footer"></footer>
<script>const ROOT = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
renderChrome("progress");

function draw() {
  const st = loadStore();
  document.getElementById("modules").innerHTML = MODULES.map(moduleCardHTML).join("");
  document.getElementById("stats").innerHTML = `<span class="pill pill-gold">${st.learned.length} of ${SIGNS.length} signs learned</span><span class="pill pill-leaf">Best quiz score: ${st.quizBest} of 10</span>`;
  const list = SIGNS.filter(s => st.learned.includes(s.id));
  document.getElementById("learned").innerHTML = list.length ? list.map(signCardHTML).join("") : '<p class="muted">No signs yet. Open any sign and choose Mark as learned.</p>';
}
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Reset all saved progress in this browser?")) { saveStore({ learned: [], lessons: [], quizBest: 0 }); draw(); }
});
draw();

initFallbacks();
</script>
</body>
</html>
